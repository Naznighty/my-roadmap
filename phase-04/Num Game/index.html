<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="start">
      <h1>Guess the <span class="glow">NUMBER</span></h1>
      <button id="startBtn">START</button>
    </section>

    <section class="home hidden">
      <h2>Guess a number from 1 to 100</h2>
      <p id="attempts"></p>
      <input id="number" type="number" min="1" max="100" />
      <button id="goBtn" type="button">Go</button>
      <p id="message"></p>
      <button id="restartBtn" class="hidden" type="button">Play again</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
