<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: rgb(255, 235, 243)">
    <div style="width: 400px; margin: 50px auto; font-size: 25px; gap: 20px">
      <h1 style="text-align: center">Registration Form</h1>
      <form>
        <div style="margin-bottom: 20px">
          <label for="fullname">Full Name: </label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name: "
            required
          />
        </div>

        <div style="margin-bottom: 20px">
          <label for="email" style="display: inline-block; width: 110px"
            >Email:
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </div>
        <div style="margin-bottom: 20px">
          <label for="password" style="display: inline-block; width: 110px"
            >Password:
          </label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
          />
        </div>
        <div style="margin-bottom: 20px">
          <label for="age" style="display: inline-block; width: 110px"
            >Age:
          </label>
          <input type="date" id="age" name="age" min="18" max="100" required />
        </div>

        <div style="margin-bottom: 20px">
          <label style="display: inline-block; width: 100px">Gender:</label>

          <input type="radio" id="male" name="gender" value="male" required />
          <label for="male" style="display: inline-block; width: 110px"
            >Male</label
          >

          <input type="radio" id="female" name="gender" value="female" />
          <label for="female" style="display: inline-block; width: 100px"
            >Female</label
          >
        </div>

        <div style="margin-bottom: 20px">
          <label for="message">Enter your message:</label>
          <br /><br />
          <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Your message"
            required
          >
          </textarea>
        </div>

        <button type="submit" style="font-size: 25px">Register</button>
      </form>
    </div>
  </body>
</html>
